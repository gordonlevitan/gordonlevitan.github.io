<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sacha Baron Cohen Quote Generator</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #f5f1e8; color: #202e29;
      font-family: system-ui, sans-serif; }
    main { width: min(100%, 560px); padding: clamp(24px, 6vw, 48px);
      background: #fffdf8; border: 1px solid #d9dfd0; border-radius: 24px;
      text-align: center; box-shadow: 0 16px 48px #202e2910; }
    .eyebrow { color: #506958; font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 2px; }
    h1 { font-size: clamp(28px, 6vw, 40px); margin: 16px 0 8px; }
    .intro, footer { color: #5d685e; line-height: 1.6; }
    #result { min-height: 180px; display: flex; flex-direction: column;
      justify-content: center; }
    blockquote { font-size: 30px; font-weight: 650; margin: 24px 0 12px; }
    #character { margin: 0 0 24px; color: #506958; }
    button { position: relative; max-width: 100%; padding: 19px 32px;
      border: 3px solid #30204a; border-radius: 18px 8px 18px 8px;
      background: linear-gradient(115deg, #ff91ce, #ffd76a 65%, #c4f477);
      color: #30204a; font: inherit; font-weight: 850; font-size: 18px;
      box-shadow: 6px 7px 0 #30204a; transform: rotate(-3deg);
      cursor: pointer; touch-action: manipulation;
      transition: transform 160ms ease, box-shadow 160ms ease; }
    button::before, button::after { position: absolute; color: #7541ad;
      font-size: 28px; pointer-events: none; }
    button::before { content: "✦"; top: -25px; left: -13px; }
    button::after { content: "✧"; bottom: -27px; right: -13px; }
    button:hover { transform: translateY(-3px) rotate(2deg);
      box-shadow: 8px 10px 0 #30204a; }
    button:active { transform: translate(5px, 5px) rotate(0deg);
      box-shadow: 1px 2px 0 #30204a; }
    button:focus-visible { outline: 3px solid #7541ad; outline-offset: 8px; }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; transform: none; }
      button:hover, button:active { transform: none; }
    }
    footer { margin-top: 28px; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">The clean quote collection</p>
    <h1>Sacha Baron Cohen Quote Generator</h1>
    <p class="intro">A few family-friendly catchphrases from<br>Sacha Baron Cohen's characters.</p>
    <div id="result" aria-live="polite" aria-atomic="true">
      <blockquote id="quote">Ready for a quote?</blockquote>
      <p id="character">Press the button below.</p>
    </div>
    <button id="next" type="button">Give me a quote</button>
    <footer><span id="quote-count"></span> clean quotes · Borat, Ali G &amp; King Julien · Works offline</footer>
  </main>
  <script>
    // This fixed collection keeps every possible result family-friendly.
    const quotes = [
      { text: "Very nice!", character: "Borat" },
      { text: "Great success!", character: "Borat" },
      { text: "Booyakasha!", character: "Ali G" },
      { text: "Respect!", character: "Ali G" },
      { text: "Jagshemash!", character: "Borat" },
      // Short excerpts from King Julien's dialogue in Madagascar (2005).
      { text: "Please feel free to bask in my glow!", character: "King Julien" },
      { text: "Welcome to Madagascar.", character: "King Julien" },
      { text: "Wait. I have a plan.", character: "King Julien" },
      { text: "See you later, crocodile.", character: "King Julien" },
      { text: "Nonsense, Maurice!", character: "King Julien" }
    ];
    let previousCharacter = null;

    function showQuote() {
      // Exclude every quote by the last character, not just the last quote.
      const choices = quotes.filter(quote => quote.character !== previousCharacter);
      const quote = choices[Math.floor(Math.random() * choices.length)];
      previousCharacter = quote.character;
      document.getElementById("quote").textContent = `“${quote.text}”`;
      document.getElementById("character").textContent = `— ${quote.character}`;
      document.getElementById("next").textContent = "Another quote";
    }

    document.getElementById("quote-count").textContent = quotes.length;
    document.getElementById("next").addEventListener("click", showQuote);
  </script>
</body>
</html>
